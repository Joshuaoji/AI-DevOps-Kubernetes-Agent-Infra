apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: web
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: REPLACE_NODE_ROLE
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_CLUSTER_NAME
        karpenter.sh/tier: web
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: REPLACE_CLUSTER_NAME
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    Tier: web
    ManagedBy: karpenter
